<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi viaje · Equipo</title><link rel="stylesheet" href="/style.css"><style>body.portal{display:block;background:#f3f6f3}.portal main{margin:0 auto;padding:24px;max-width:900px}.portal header{padding:0 0 24px;display:flex;justify-content:space-between;gap:12px}.portal .panel{margin:16px 0}.portal h1{font-size:32px}.portal .actions{flex-wrap:wrap}.portal .route{font-size:20px;font-weight:700}.portal .detail-list dd{overflow-wrap:anywhere}@media(max-width:600px){.portal main{padding:16px}.portal h1{font-size:26px}}</style></head><body class="portal"><main><header><div id="portalBrand"><strong>Mi viaje</strong></div><button class="text-button" id="leavePortal" type="button">Cambiar email</button></header><section class="panel" id="emailEntry"><h1>Encuentra tu viaje</h1><p>Introduce el email personal que has facilitado a coordinación.</p><form id="emailForm"><label class="field">Email personal<input id="athleteEmail" name="email" type="email" autocomplete="email" required placeholder="Tu email"></label><button class="button" id="emailSubmit" type="submit" style="margin-top:16px">Ver mi viaje</button></form><p id="sessionHint" class="small muted"></p><p class="small muted">Verás tus próximos viajes y los que todavía están en curso. No necesitas crear una cuenta.</p></section><p id="previewNotice" class="notice" hidden>Vista previa de coordinación. Las confirmaciones las realiza el deportista desde su cuenta.</p><button class="button secondary" id="changeEmail" hidden>Cambiar email</button><button class="button secondary" id="refreshPortal" hidden>↻ Actualizar mi viaje</button><div id="portal" role="status"></div><p id="portalMessage" role="status"></p></main><script type="module" src="/portal.mjs"></script></body></html>
